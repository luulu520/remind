<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新增家庭提醒</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background-color: #f7f9fa; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
    input, select, button { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
    button { background-color: #06C755; color: white; font-weight: bold; border: none; margin-top: 10px; cursor: pointer; }
    button:disabled { background-color: #a0a0a0; }
  </style>
</head>
<body>
  <h2>📅 新增行程提醒</h2>
  <form id="reminderForm">
    <div class="form-group">
      <label for="eventContent">提醒事項內容</label>
      <input type="text" id="eventContent" placeholder="例如：帶阿嬤回診" required>
    </div>

    <div class="form-group">
      <label for="remindTime">日期與時間</label>
      <input type="datetime-local" id="remindTime" required>
    </div>

    <div class="form-group">
      <label for="advanceMinutes">提前多久提醒？</label>
      <select id="advanceMinutes">
        <option value="0">準時提醒</option>
        <option value="10">提前 10 分鐘</option>
        <option value="60" selected>提前 1 小時</option>
        <option value="1440">提前 1 天</option>
      </select>
    </div>

    <button type="submit" id="submitBtn">儲存提醒</button>
  </form>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbyKpIz0aWiJgZRnqUYeXsRu9z5zKhTpJunHX6kGV6c3NxBjDm360SdPPKYlgwM1JY39/exec';
    const LIFF_ID = '2011628456-Ub15d7S3';

    // 初始化 LIFF
    document.addEventListener("DOMContentLoaded", function() {
      liff.init({ liffId: LIFF_ID }).catch(err => console.error(err));
    });

    document.getElementById('reminderForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = '處理中...';

      const payload = {
        eventContent: document.getElementById('eventContent').value,
        remindTime: document.getElementById('remindTime').value,
        advanceMinutes: parseInt(document.getElementById('advanceMinutes').value)
      };

      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        alert('提醒設定成功！');
        liff.closeWindow(); // 關閉 LIFF 視窗
      })
      .catch(err => {
        alert('設定失敗，請重試');
        submitBtn.disabled = false;
        submitBtn.innerText = '儲存提醒';
      });
    });
  </script>
</body>
</html>
